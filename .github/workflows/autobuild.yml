name: CI Build

permissions:
  contents: read
  actions: read
  checks: write

on:
  push:
    paths:
    - 'Src/**'
    - '.github/workflows/autobuild.yml'

jobs:
  build:
    name: 'Build'
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        cache: true
        cache-dependency-path: 'Src/*/packages.lock.json'

    - name: Restore NuGet Packages
      run: dotnet restore --use-lock-file

    - name: Build and Publish x64
      run: dotnet publish --runtime win-x64 --no-restore

    - name: Build and Publish ARM64
      run: dotnet publish --runtime win-arm64 --no-restore

    - name: Extract Version
      id: version
      shell: pwsh
      run: |
        [string]$version = (Select-Xml -Path 'Src/SpecterOps.Passkeys.Injector/SpecterOps.Passkeys.Injector.csproj' -XPath '//Version').Node.InnerText
        "VERSION=$version" >> $env:GITHUB_OUTPUT

    - name: Upload x64 Binary as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PasskeyInjector_v${{ steps.version.outputs.VERSION }}_x64
        path: Build/publish/SpecterOps.Passkeys.Injector/release_win-x64/*

    - name: Upload ARM64 Binary as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PasskeyInjector_v${{ steps.version.outputs.VERSION }}_arm64
        path: Build/publish/SpecterOps.Passkeys.Injector/release_win-arm64/*
